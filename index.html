<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Exam - Mobile Anti-Cheat</title>
    <style>
        :root {
            --primary: #6366f1;
            --danger: #f43f5e;
            --success: #10b981;
            --bg: #0f172a;
            --card: #1e293b;
        }

        /* Mencegah scrolling dan pull-to-refresh di HP */
        html, body { 
            overscroll-behavior-y: none; 
            overflow: hidden;
            width: 100%; height: 100%;
            background: var(--bg);
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * { touch-action: manipulation; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        .hide { display: none !important; }

        /* Login & UI Glassmorphism */
        .glass { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        
        .screen {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            padding: 15px; overflow-y: auto;
        }

        .login-box { width: 100%; max-width: 400px; margin: auto; padding: 2rem; border-radius: 24px; text-align: center; }

        input {
            width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px;
            border: 1px solid #334155; background: #020617; color: white;
            font-size: 16px; /* Penting: 16px mencegah auto-zoom di iOS */
        }

        /* Dashboard Monitor Guru */
        .grid-monitor {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px; margin-top: 20px;
        }
        .card-siswa {
            padding: 10px; border-radius: 12px; font-size: 0.75rem;
            position: relative; overflow: hidden;
        }
        .snap-img { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; margin-bottom: 5px; }
        .badge-alert { position: absolute; top: 5px; right: 5px; background: var(--danger); padding: 2px 6px; border-radius: 10px; font-size: 0.6rem; }

        /* Interface Siswa */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #334155; }
        .soal-card { margin-top: 20px; padding: 20px; border-radius: 20px; }
        .opsi { 
            background: var(--card); padding: 16px; margin: 12px 0; border-radius: 15px;
            border: 2px solid transparent; transition: 0.2s;
        }
        .opsi.active { border-color: var(--primary); background: #312e81; }

        .btn { 
            background: var(--primary); color: white; border: none; padding: 15px; 
            border-radius: 12px; font-weight: bold; width: 100%; margin-top: 10px;
        }
    </style>
</head>
<body oncontextmenu="return false">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="screen">
        <div class="login-box glass">
            <h2>Exam Guard Pro Arrafiimuhammadd</h2>
            <p style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 20px;">Live Monitoring & Anti-Cheat</p>
            
            <input type="text" id="inputNama" placeholder="Nama Lengkap">
            <input type="text" id="inputKode" placeholder="Kode Ujian">
            <button class="btn" onclick="startApp('siswa')">Mulai Ujian</button>
            
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #334155;">
            <p onclick="document.getElementById('guruForm').classList.toggle('hide')" style="cursor:pointer; font-size: 0.8rem;">Akses Guru</p>
            <div id="guruForm" class="hide">
                <input type="password" id="passGuru" placeholder="Password Guru">
                <button class="btn" style="background:#475569" onclick="startApp('guru')">Login Monitoring</button>
            </div>
        </div>
    </div>

    <!-- SISWA UI -->
    <div id="siswaUI" class="screen hide">
        <div class="header">
            <div><b id="displayNama">-</b><br><small id="statusCon" style="color:var(--success)">Online</small></div>
            <div style="text-align: right;"><span id="vCount" style="color:var(--danger)">0 Pelanggaran</span></div>
        </div>
        <div class="soal-card glass">
            <h3 id="qText">Memuat soal...</h3>
            <div id="opsiContainer"></div>
            <button class="btn" onclick="nextSoal()">Soal Selanjutnya</button>
        </div>
        <video id="camView" style="display:none" autoplay playsinline></video>
        <canvas id="capCanvas" style="display:none"></canvas>
    </div>

    <!-- GURU UI -->
    <div id="guruUI" class="screen hide">
        <div class="header">
            <h3>Live Dashboard</h3>
            <button class="btn" style="width:auto; padding: 5px 15px;" onclick="location.reload()">Log Out</button>
        </div>
        <div id="monitorGrid" class="grid-monitor"></div>
    </div>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <script>
        // 1. KONFIGURASI (Ganti dengan milik Anda)
        const firebaseConfig = {
            apiKey: "AIzaSy...",
            databaseURL: "https://your-project.firebaseio.com",
            projectId: "your-project",
            appId: "1:..."
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let userRole = '';
        let uName = '';
        let uKode = '';
        let violation = 0;
        let isStarted = false;
        let currentIdx = 0;
        let wakeLock = null;

        const soal = [
            {q: "Berapa hasil dari 5 + 5?", o: ["8", "9", "10", "11"], a: 2},
            {q: "Apa ibukota Indonesia?", o: ["Jakarta", "IKN", "Bandung", "Surabaya"], a: 1}
        ];

        // 2. CORE LOGIC
        async function startApp(role) {
            userRole = role;
            if(role === 'siswa') {
                uName = document.getElementById('inputNama').value;
                uKode = document.getElementById('inputKode').value;
                if(!uName || !uKode) return alert("Isi nama dan kode!");
                
                // Minta izin kamera
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                    document.getElementById('camView').srcObject = stream;
                    initSiswa();
                } catch(e) { alert("Izin kamera diperlukan!"); }
            } else {
                if(document.getElementById('passGuru').value !== "admin123") return alert("Salah password!");
                initGuru();
            }
        }

        // 3. SISWA SIDE
        async function initSiswa() {
            document.getElementById('loginScreen').classList.add('hide');
            document.getElementById('siswaUI').classList.remove('hide');
            document.getElementById('displayNama').innerText = uName;
            isStarted = true;

            // Mencegah HP Sleep
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
            }

            renderSoal();
            setupAntiCheat();
            
            // Loop sinkronisasi setiap 4 detik
            setInterval(syncData, 4000);
        }

        function renderSoal() {
            const data = soal[currentIdx];
            document.getElementById('qText').innerText = `${currentIdx + 1}. ${data.q}`;
            let html = "";
            data.o.forEach((opt, i) => {
                html += `<div class="opsi" onclick="select(this, ${i})">${opt}</div>`;
            });
            document.getElementById('opsiContainer').innerHTML = html;
        }

        function select(el, idx) {
            document.querySelectorAll('.opsi').forEach(o => o.classList.remove('active'));
            el.classList.add('active');
        }

        function nextSoal() {
            if(currentIdx < soal.length - 1) {
                currentIdx++;
                renderSoal();
            } else {
                alert("Ujian Selesai!");
                db.ref(`exams/${uKode}/users/${uName}`).update({status: "Selesai"});
                location.reload();
            }
        }

        // 4. ANTI CHAT LOGIC (HP Optimized)
        function setupAntiCheat() {
            // Deteksi Pindah Aplikasi / Tarik Notif (Blur)
            window.addEventListener('blur', () => {
                if(isStarted) logViolation("Meninggalkan Halaman / Membuka Notifikasi");
            });

            // Deteksi Ganti Tab (Visibility)
            document.addEventListener('visibilitychange', () => {
                if(document.hidden && isStarted) logViolation("Pindah Tab Browser");
            });

            // Mencegah Tombol Back
            window.history.pushState(null, null, window.location.href);
            window.onpopstate = () => window.history.go(1);
        }

        function logViolation(msg) {
            violation++;
            document.getElementById('vCount').innerText = `${violation} Pelanggaran`;
            
            // Simpan riwayat pelanggaran ke Firebase
            db.ref(`exams/${uKode}/users/${uName}/logs`).push({
                time: new Date().toLocaleTimeString(),
                reason: msg
            });

            if(violation >= 5) {
                alert("Anda didiskualifikasi!");
                location.reload();
            }
        }

        function syncData() {
            const video = document.getElementById('camView');
            const canvas = document.getElementById('capCanvas');
            canvas.width = 120; canvas.height = 160;
            canvas.getContext('2d').drawImage(video, 0, 0, 120, 160);
            
            db.ref(`exams/${uKode}/users/${uName}`).update({
                lastSeen: Date.now(),
                violationCount: violation,
                progress: currentIdx + 1,
                img: canvas.toDataURL('image/jpeg', 0.5)
            });
        }

        // 5. GURU SIDE
        function initGuru() {
            document.getElementById('loginScreen').classList.add('hide');
            document.getElementById('guruUI').classList.remove('hide');

            db.ref(`exams`).on('value', snap => {
                let html = "";
                const exams = snap.val();
                for(let kode in exams) {
                    const users = exams[kode].users;
                    for(let name in users) {
                        const u = users[name];
                        const isOffline = (Date.now() - u.lastSeen) > 10000;
                        html += `
                            <div class="card-siswa glass" style="border: 1px solid ${u.violationCount > 0 ? '#f43f5e' : '#334155'}">
                                ${u.violationCount > 0 ? `<span class="badge-alert">${u.violationCount}</span>` : ''}
                                <img src="${u.img}" class="snap-img" style="filter: ${isOffline ? 'grayscale(1)' : 'none'}">
                                <b>${name}</b><br>
                                <small>KODE: ${kode}</small><br>
                                <small>Progres: ${u.progress}/${soal.length}</small><br>
                                <small style="color:${isOffline ? 'red' : '#10b981'}">${isOffline ? 'OFFLINE' : 'ONLINE'}</small>
                            </div>
                        `;
                    }
                }
                document.getElementById('monitorGrid').innerHTML = html;
            });
        }
    </script>
</body>
</html>
